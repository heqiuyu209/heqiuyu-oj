server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Docker 内部 DNS，允许后端稍后启动或重建
    resolver 127.0.0.11 valid=10s;

    # Stream private video uploads to the backend without buffering a GiB on disk.
    location = /api/admin/knowledge/video-imports {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        set $backend hoj-backend:6688;
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend hoj-backend:6688;
        proxy_pass http://$backend$request_uri;
        # Local PDF OCR and explicitly requested model answers have bounded
        # service deadlines above Nginx's default 60 seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /scrollBoard {
        return 301 /scrollBoard/;
    }

    location /scrollBoard/ {
        alias /usr/share/nginx/scrollBoard/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
