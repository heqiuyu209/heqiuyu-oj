volumes:
  hoj-local-mysql-data-v2:
  hoj-local-redis-data:
  hoj-local-files:
  hoj-local-testcases:
  hoj-local-backend-logs:
  hoj-local-judge-run:
  hoj-local-judge-spj:
  hoj-local-judge-interactive:
  hoj-local-judge-logs:

services:
  hoj-backend:
    image: hoj-backend:local
    build:
      context: .
      dockerfile: hoj-deploy/backend.Dockerfile
    depends_on:
      hoj-mysql:
        condition: service_healthy
      hoj-redis:
        condition: service_healthy
      hoj-nacos:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      BACKEND_SERVER_PORT: "6688"

      NACOS_URL: hoj-nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos

      MYSQL_HOST: hoj-mysql
      MYSQL_PORT: "3306"
      MYSQL_PUBLIC_HOST: hoj-mysql
      MYSQL_PUBLIC_PORT: "3306"
      MYSQL_DATABASE_NAME: hoj
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: hoj-local-dev

      REDIS_HOST: hoj-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: hoj-local-redis

      OPEN_REMOTE_JUDGE: "false"
    volumes:
      - hoj-local-files:/hoj/file
      - hoj-local-testcases:/hoj/testcase
      - hoj-local-backend-logs:/hoj/log/backend
    ports:
      - "127.0.0.1:6688:6688"

  hoj-frontend:
    image: hoj-frontend:local
    build:
      context: .
      dockerfile: hoj-deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"

  hoj-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: hoj-local-dev
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - hoj-local-mysql-data-v2:/var/lib/mysql
      - ./sqlAndsetting/hoj.sql:/docker-entrypoint-initdb.d/01-hoj.sql:ro
      - ./sqlAndsetting/nacos.sql:/docker-entrypoint-initdb.d/02-nacos.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -uroot -e "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  hoj-redis:
    image: redis:5.0.9-alpine
    command:
      - redis-server
      - --requirepass
      - hoj-local-redis
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: hoj-local-redis
    volumes:
      - hoj-local-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  hoj-nacos:
    image: nacos/nacos-server:1.4.2
    depends_on:
      hoj-mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: hoj-mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: hoj-local-dev
      NACOS_AUTH_ENABLE: "true"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:8848:8848"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8848/nacos/index.html > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  hoj-judgeserver:
    image: hoj-judgeserver:local
    build:
      context: .
      dockerfile: hoj-deploy/judgeserver.Dockerfile

    depends_on:
      hoj-mysql:
        condition: service_healthy
      hoj-redis:
        condition: service_healthy
      hoj-nacos:
        condition: service_healthy

    environment:
      TZ: Asia/Shanghai
      NACOS_URL: hoj-nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      JUDGE_SERVER_IP: "-1"
      JUDGE_SERVER_PORT: "8088"
      JUDGE_SERVER_NAME: local-judger-1
      MAX_TASK_NUM: "2"
      PARALLEL_TASK: "2"
      REMOTE_JUDGE_OPEN: "false"
      JAVA_OPTS: "-Xms128m -Xmx512m"

    volumes:
      - hoj-local-testcases:/judge/test_case
      - hoj-local-judge-run:/judge/run
      - hoj-local-judge-spj:/judge/spj
      - hoj-local-judge-interactive:/judge/interactive
      - hoj-local-judge-logs:/judge/log

    privileged: true
    shm_size: 512mb

    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8088/version > /dev/null || exit 1"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s