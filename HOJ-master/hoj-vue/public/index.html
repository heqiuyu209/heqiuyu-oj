<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/webp" href="<%= BASE_URL %>cdutetc.webp">
  <!-- 使用CDN的CSS文件 -->
  <% for (var i in htmlWebpackPlugin.options.cdn &&
  htmlWebpackPlugin.options.cdn.css) { %>
  <link href="<%= htmlWebpackPlugin.options.cdn.css[i] %>" rel="stylesheet" />
  <% } %>
  <title>CDUTETC · 成理工程在线测评平台</title>
  <script>
    // Match appearance.js before the application CSS and JavaScript have loaded.
    var initialTheme = 'light';
    try {
      var appearance = JSON.parse(localStorage.getItem('cdutetc:appearance')) || {};
      if (appearance.theme === 'dark' ||
          (appearance.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        initialTheme = 'dark';
      }
    } catch (_) {}
    document.documentElement.dataset.theme = initialTheme;
  </script>
  <script>
    // IE 10 and earlier
    if (window.navigator.userAgent.indexOf('MSIE ') > 0 &&
      window.confirm('Your browser is not supported, click \'OK\' to update')) {
      window.location = 'http://outdatedbrowser.com'
    }
  </script>
  <style>
    :root {
      --boot-page: #edf3f6; --boot-text: #233e4c; --boot-muted: #657c88;
      --boot-accent: #217c9e; --boot-line: #d8e5eb;
      color-scheme: light;
    }
    :root[data-theme='dark'] {
      --boot-page: #101f29; --boot-text: #deedf4; --boot-muted: #a5bdc9;
      --boot-accent: #7acbe5; --boot-line: #345260;
      color-scheme: dark;
    }
    body { background: var(--boot-page); }
    #app-loader {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-sizing: border-box; padding: 24px; text-align: center;
      background: var(--boot-page); color: var(--boot-text);
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    }
    #app-loader .loader-badge { position: relative; width: 92px; height: 92px; display: grid; place-items: center; margin-bottom: 24px; }
    #app-loader .loader-badge::after {
      content: ''; position: absolute; inset: 0;
      border: 2px solid var(--boot-line); border-top-color: var(--boot-accent); border-radius: 50%;
      animation: loader-turn 1.8s linear infinite;
    }
    #app-loader img { display: block; width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
    #app-loader .loader-name { font-size: 24px; font-weight: 650; letter-spacing: .04em; }
    #app-loader .loader-caption { margin: 8px 0 22px; color: var(--boot-muted); font-size: 13px; line-height: 1.6; }
    #app-loader .loader-status { color: var(--boot-muted); font-size: 13px; }
    @keyframes loader-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .loader-badge::after { animation: none; }
    }
  </style>
</head>
<body>
  <noscript>
    <strong>请启用 JavaScript 后使用成理工程在线测评平台。</strong>
    <style>#app-loader { display: none; }</style>
  </noscript>
  <div id="app"></div>
  <!-- Removed by App.vue once Vue is ready. The badge keeps its original colors. -->
  <div id="app-loader" role="status" aria-live="polite" aria-label="成理工程在线测评平台正在加载">
    <div class="loader-badge" aria-hidden="true">
      <img src="<%= BASE_URL %>cdutetc.webp" width="72" height="72" alt="">
    </div>
    <div class="loader-name">CDUTETC</div>
    <div class="loader-caption">成理工程在线测评平台</div>
    <div class="loader-status">正在加载，请稍候…</div>
  </div>
  <!-- 使用CDN的JS文件 -->
  <% for (var i in htmlWebpackPlugin.options.cdn &&
  htmlWebpackPlugin.options.cdn.js) { %>
  <script src="<%= htmlWebpackPlugin.options.cdn.js[i] %>"></script>
  <% } %>
</body>
</html>
