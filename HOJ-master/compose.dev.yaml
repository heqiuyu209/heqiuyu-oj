# Local development overlay. Keep compose.yaml for production image builds.
# Requires Docker Compose 2.24.4+ for !override.
services:
  hoj-frontend:
    image: node:22-bookworm-slim
    build: !reset null
    working_dir: /workspace/hoj-vue
    init: true
    command: ["node", "/opt/hoj/frontend-dev.cjs"]
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
      CDUTETC_LOCAL_ASSETS: "1"
      HOJ_DEV_API_TARGET: http://hoj-backend:6688
      # Docker Desktop may not forward Windows filesystem change events.
      HOJ_DEV_POLL: "1000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports: !override
      - "127.0.0.1:8080:8066"
    volumes:
      - ./hoj-vue:/workspace/hoj-vue:ro
      - hoj-local-frontend-modules:/workspace/hoj-vue/node_modules
      - hoj-local-frontend-npm-cache:/root/.npm
      - ./hoj-scrollBoard:/workspace/hoj-scrollBoard:ro
      - ./hoj-deploy/frontend-dev.cjs:/opt/hoj/frontend-dev.cjs:ro
    depends_on:
      hoj-backend:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8066/index.html',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(4000,function(){this.destroy();process.exit(1)})"
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 12

volumes:
  hoj-local-frontend-modules:
  hoj-local-frontend-npm-cache:
